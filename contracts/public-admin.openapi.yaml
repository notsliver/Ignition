openapi: 3.1.0
info:
  title: Ignition Instance Admin API
  version: 1.0.0
  description: Instance admin Bearer tokens only. Browser-only token management is
    separate. User creation follows current personal-team and authentication policy.
    Setup URLs are returned once; email delivery is external. Public resource IDs
    are runtime resource UUIDs. Prices are informational.
servers:
- url: /api/admin/v1
security:
- adminToken: []
components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      bearerFormat: ign_admin_...
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - bad_request
              - unauthenticated
              - forbidden
              - not_found
              - conflict
              - validation_failed
              - rate_limited
              - unsupported
              - unavailable
              - internal
              - offline
              - team_required
              - team_access_lost
              - reauth_required
            message:
              type: string
            fields:
              type:
              - object
              - 'null'
              additionalProperties:
                type: string
              description: Per-field messages for 422 responses
            requestId:
              type: string
    ProductInput: &id021
      type: object
      additionalProperties: false
      properties: &id022
        name: &id001
          type: string
        description: *id001
        category: *id001
        kind: &id010
          type: string
          enum:
          - application
          - database
          - worker
          - function
          - game
          - files
        status: &id011
          type: string
          enum:
          - draft
          - active
          - retired
        template:
          type: object
        icon: *id001
        placement: &id012
          type: object
          additionalProperties: false
          properties:
            servers:
              type: array
              items: &id003
                type: string
                format: uuid
            locations:
              type: array
              items: *id001
            ips:
              type: array
              items: *id001
            strategy:
              type: string
              enum:
              - least-utilized
              - most-available
              - spread
              - random
              - location
              - manual
            preferredLocation: *id001
            allowMaintenance: &id017
              type: boolean
            minFreeMemoryMb: &id002
              type: integer
              minimum: 0
            minFreeCpus:
              type: number
              minimum: 0
            safetyMarginPct:
              type: integer
              minimum: 0
              maximum: 50
            stock: *id002
            perTeam: *id002
            perServer: *id002
            maxConcurrent: *id002
        plans:
          type: array
          minItems: 1
          maxItems: 20
          items: &id004
            type: object
            additionalProperties: false
            properties: &id023
              id: *id003
              name: *id001
              cpus: &id007
                type: number
                minimum: 0.1
                maximum: 64
              memoryMb: &id008
                type: integer
                minimum: 64
                maximum: 262144
              storageGb: *id002
              backupGb: *id002
              ports: *id002
              price: *id001
              currency: *id001
              period: &id009
                type: string
                enum:
                - month
                - quarter
                - year
                - once
            required:
            - name
            - cpus
            - memoryMb
      required:
      - name
      - kind
      - plans
    PlanInput: *id004
    CreateResource: &id024
      type: object
      additionalProperties: false
      description: 'Choose exactly one provisioning mode: productId plus planId, or configuration
        without a product/plan. Both return 202 with resourceId and operationId. Manual
        resources have managed=false and no catalog assignment.'
      properties:
        teamId: &manual_001
          type: string
          format: uuid
        productId: *manual_001
        planId: *manual_001
        name: &manual_002
          type: string
        note:
          type: string
          maxLength: 2000
        externalId: *manual_002
        answers:
          type: object
        serverId: *manual_001
        configuration:
          oneOf:
          - type: object
            additionalProperties: false
            properties:
              projectId: *manual_001
              environmentId: *manual_001
              cpus: &manual_003
                type: number
                exclusiveMinimum: 0
                maximum: 64
              memoryMb: &manual_004
                type: integer
                minimum: 64
                maximum: 65536
              type:
                type: string
                enum:
                - application
                - worker
                - database
                - function
                default: application
              sourceType:
                type: string
                enum:
                - image
                - git
              image: *manual_002
              repoUrl: *manual_002
              branch: *manual_002
              dockerfile: *manual_002
              port:
                type:
                - integer
                - 'null'
                minimum: 1
                maximum: 65535
              command: *manual_002
              dataPath: *manual_002
              sourceId: *manual_001
              engine: *manual_002
              code: *manual_002
              env:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    key: *manual_002
                    value: *manual_002
                    secret:
                      type: boolean
                  required:
                  - key
                  - value
            description: Manual application, worker, database or function. Omitted CPU
              and memory use instance defaults. Image sources require image; Git sources
              require repoUrl. Functions use engine and code.
          - type: object
            additionalProperties: false
            properties:
              projectId: *manual_001
              environmentId: *manual_001
              cpus: *manual_003
              memoryMb: *manual_004
              type:
                type: string
                const: game
              game: *manual_002
              spec:
                type: object
                additionalProperties: false
                properties:
                  edition: *manual_002
                  version: *manual_002
                  loaderVersion: *manual_002
                  displayName: *manual_002
                  customUrl: *manual_002
                  slots:
                    type: integer
                  java:
                    type: integer
                  options:
                    type: object
                    additionalProperties: *manual_002
                  modpack:
                    type: object
                    additionalProperties: false
                    properties:
                      provider: *manual_002
                      projectId: *manual_002
                      versionId: *manual_002
                      title: *manual_002
                      iconUrl: *manual_002
                      versionNumber: *manual_002
                      gameVersion: *manual_002
                      loader: *manual_002
              acceptEula:
                type: boolean
            required:
            - type
            - game
            - spec
            description: Manual game server. Game-specific settings and EULA acceptance
              are validated by the installed game adapter; omitted sizes follow its defaults.
      required:
      - teamId
      - name
      oneOf:
      - title: Product and plan
        required:
        - productId
        - planId
        not:
          required:
          - configuration
      - title: Manual configuration
        required:
        - configuration
        not:
          anyOf:
          - required:
            - productId
          - required:
            - planId
          - required:
            - answers
          - required:
            - serverId
    CreateUser: &id018
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        name: *id001
        role:
          type: string
          enum:
          - viewer
          - developer
        externalId: *id001
      required:
      - email
      - name
    Operation:
      type: object
      additionalProperties: true
      properties:
        id: *id003
        resourceId: *id003
        deploymentId:
          type:
          - string
          - 'null'
          format: uuid
        type: *id001
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - cancelled
        error:
          type:
          - string
          - 'null'
        createdAt: &id006
          type: string
          format: date-time
        completedAt:
          type:
          - string
          - 'null'
          format: date-time
        details:
          type: object
          description: Observed result metadata; deletion includes retainedVolumes
            and resourceSnapshot.
    Permission:
      type: object
      properties:
        key:
          type: string
        group:
          type: string
        label:
          type: string
        description:
          type: string
        role:
          type: string
        grantable:
          type: boolean
      required:
      - key
      - label
    AdminToken:
      type: object
      properties:
        id: &id005
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
        createdBy: *id005
        creatorActive:
          type: boolean
        permissions:
          type: array
          items:
            type: string
        networks:
          type: array
          items:
            type: string
        expiresAt:
          type: [string, "null"]
          format: date-time
          description: Null means the token never expires.
        createdAt: *id006
        revokedAt:
          type:
          - string
          - 'null'
          format: date-time
        lastUsedAt:
          type:
          - string
          - 'null'
          format: date-time
        lastIp:
          type: string
      required:
      - id
      - name
      - prefix
      - permissions
      - expiresAt
    Environment:
      type: object
      properties:
        id: *id005
        name:
          type: string
      required:
      - id
      - name
    Team:
      type: object
      properties:
        id: *id005
        name:
          type: string
        slug:
          type: string
        role:
          type: string
        experiences:
          type: array
          items:
            type: string
        externalId:
          type: string
        defaultEnvironment:
          $ref: '#/components/schemas/Environment'
      required:
      - id
      - name
    Customer:
      type: object
      properties:
        id: *id005
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum:
          - viewer
          - developer
        status:
          type: string
          enum:
          - active
          - suspended
        externalId:
          type: string
        createdAt: *id006
        onboarding:
          type: object
          properties:
            method:
              type: string
            state:
              type: string
              enum:
              - pending
              - complete
        createdTeam:
          anyOf:
          - $ref: '#/components/schemas/Team'
          - type: 'null'
        teams:
          type: array
          items:
            $ref: '#/components/schemas/Team'
      required:
      - id
      - email
      - name
      - role
      - status
    Plan:
      type: object
      properties:
        id: *id003
        name: *id001
        cpus: *id007
        memoryMb: *id008
        storageGb: *id002
        backupGb: *id002
        ports: *id002
        price: *id001
        currency: *id001
        period: *id009
        assignedResources:
          type: integer
          minimum: 0
      required:
      - id
      - name
      - cpus
      - memoryMb
      - storageGb
      - backupGb
      - ports
      - price
      - currency
      - period
    Product:
      type: object
      properties:
        name: *id001
        description: *id001
        category: *id001
        kind: *id010
        status: *id011
        template:
          type: object
          description: Template settings. Environment values and secret fields are
            redacted; send unchanged=true on existing keyed environment variables
            to preserve their values.
        icon: *id001
        placement: *id012
        plans:
          type: array
          items:
            $ref: '#/components/schemas/Plan'
        id: *id005
        assignedResources:
          type: integer
          minimum: 0
        createdAt: *id006
        updatedAt: *id006
      required:
      - id
      - name
      - kind
      - status
      - plans
    Resource:
      type: object
      properties:
        id: *id005
        name:
          type: string
        kind:
          type: string
        teamId: *id005
        projectId: &id013
          type:
          - string
          - 'null'
          format: uuid
        environmentId: *id013
        serverId: *id013
        externalId:
          type:
          - string
          - 'null'
        managed:
          type: boolean
        managementStatus:
          type:
          - string
          - 'null'
          enum:
          - active
          - suspended
          - terminated
          - null
        runtimeStatus:
          type: string
        productId: *id013
        planId: *id013
        cpus:
          type:
          - number
          - 'null'
        memoryMb:
          type:
          - integer
          - 'null'
        suspendedReason:
          type: string
        note:
          type: string
      required:
      - id
      - name
      - teamId
      - managed
      - runtimeStatus
    AcceptedResourceOperation:
      type: object
      properties:
        resourceId: *id005
        operationId: *id005
        deploymentId: *id013
      required:
      - resourceId
      - operationId
    SetupLink:
      type: object
      properties:
        url:
          type: string
          format: uri
        method:
          type: string
          enum:
          - password
          - sso
        expiresInSeconds:
          type: integer
      required:
      - url
      - method
      - expiresInSeconds
    Webhook:
      type: object
      properties:
        id: *id005
        url: &id014
          type: string
          format: uri
        events: &id015
          type: array
          items:
            type: string
        enabled: &id016
          type: boolean
      required:
      - id
      - url
      - events
      - enabled
    CreatedWebhook:
      type: object
      properties:
        id: *id005
        url: *id014
        events: *id015
        enabled: *id016
        signingSecret:
          type: string
          description: Shown only on creation; the original result is returned on
            an authorized idempotent replay.
      required:
      - id
      - url
      - events
      - enabled
      - signingSecret
    Delivery:
      type: object
      properties:
        id: *id005
        eventId: *id005
        status:
          type: string
          enum:
          - pending
          - delivered
          - failed
        attempts:
          type: integer
        responseStatus:
          type:
          - integer
          - 'null'
        error:
          type: string
        createdAt: *id006
      required:
      - id
      - eventId
      - status
      - attempts
    Allocation:
      type: object
      properties:
        id: *id005
        ip:
          type: string
        port:
          type: integer
        alias:
          type: string
        resourceId: *id013
        resourceName:
          type: string
        teamName:
          type: string
        createdAt: *id006
      required:
      - id
      - ip
      - port
    AuditEvent:
      type: object
      properties:
        id:
          type: integer
          format: int64
        actor:
          type: string
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
        detail:
          type:
          - object
          - 'null'
        ip:
          type: string
        createdAt: *id006
      required:
      - id
      - actor
      - action
      - createdAt
    Usage:
      type: object
      properties:
        resources:
          type: integer
          minimum: 0
        gameServers:
          type: integer
          minimum: 0
        applications:
          type: integer
          minimum: 0
        databases:
          type: integer
          minimum: 0
        workers:
          type: integer
          minimum: 0
        functions:
          type: integer
          minimum: 0
        memoryMb:
          type: integer
          minimum: 0
        ports:
          type: integer
          minimum: 0
        storageBytes:
          type: integer
          minimum: 0
        backupBytes:
          type: integer
          minimum: 0
        cpus:
          type: number
          minimum: 0
paths:
  /openapi.json:
    get:
      operationId: openapi
      summary: Openapi
      x-permission: Valid admin token
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            WWW-Authenticate:
              schema:
                type: string
        '403':
          description: Permission or policy restriction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Object unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: State, capacity or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Field validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              description: Seconds until retry
              schema:
                type: integer
                example: 60
        '503':
          description: Infrastructure unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - openapi.json
  /instance:
    get:
      operationId: instance
      summary: Instance
      x-permission: settings.view
      parameters: []
      responses:
        '200':
          description: Success
