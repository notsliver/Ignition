        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              description: Seconds until retry
              schema:
                type: integer
                example: 60
        '503':
          description: Infrastructure unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - instance
  /defaults:
    get:
      operationId: defaults
      summary: Read effective onboarding and resource defaults
      x-permission: settings.view
      parameters: []
      responses:
