                $ref: '#/components/schemas/Error'
        '409':
          description: State, capacity or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Field validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              description: Seconds until retry
              schema:
                type: integer
                example: 60
        '503':
          description: Infrastructure unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - token
  /capacity:
    get:
      operationId: capacity
      summary: Capacity
      x-permission: servers.view
      parameters:
      - name: window
        in: query
        schema: *id001
        required: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            WWW-Authenticate:
              schema:
                type: string
        '403':
          description: Permission or policy restriction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Object unavailable
          content:
