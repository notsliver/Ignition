openapi: 3.1.0
info:
  title: Ignition API
  version: 0.1.0
  description: 'API for Ignition, a self-hosted PaaS that runs on your own machine.

    Authentication is a session cookie (`ignition_session`, HttpOnly, SameSite=Lax) set by

    `/api/setup` or `/api/auth/login`. State-changing requests must send an `Origin` header

    matching the dashboard (CSRF protection). Every error uses the `Error` schema.

    Roles, lowest to highest: viewer, developer, admin, owner.


    Workload APIs require explicit team scope. Team and project roles are separate from platform administration. projectId is optional; teamId ownership
    is immutable.'
servers:
- {url: 'http://localhost:8080'}
security:
- {session: []}
components:
  securitySchemes: {session: {type: apiKey, in: cookie, name: ignition_session}}
  parameters: {id: {name: id, in: path, required: true, schema: {type: string, format: uuid}}}
  responses: {Error: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}}
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - bad_request
              - unauthenticated
              - forbidden
              - not_found
              - conflict
              - validation_failed
              - rate_limited
              - unsupported
              - unavailable
              - internal
              - offline
              - team_required
              - team_access_lost
              - reauth_required
            message: {type: string}
            fields: {type: object, additionalProperties: {type: string}, description: Per-field messages for 422 responses}
            requestId: {type: string}
    User:
      type: object
      properties:
        avatarUrl: {type: string, description: Authenticated image URL or an empty string for initials}
        id: {type: string, format: uuid}
        email: {type: string}
        name: {type: string}
        role: {type: string, enum: [owner, admin, developer, viewer]}
        status: {type: string, enum: [active, suspended]}
        createdAt: {type: string, format: date-time}
    Environment: {type: object, properties: {id: {type: string, format: uuid}, name: {type: string}}}
    Project:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        archived: {type: boolean}
        favorite: {type: boolean, description: Favorite for the current user}
        environments: {type: array, items: {$ref: '#/components/schemas/Environment'}}
        resourceCount: {type: integer}
        running: {type: integer}
        failed: {type: integer}
        deploying: {type: integer}
        lastDeployAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        teamId: {type: string, format: uuid}
        permissions: {type: array, items: {type: string}}
        effectiveRole: {type: string, enum: [owner, admin, developer, viewer, member]}
    Resource:
      type: object
      properties:
        id: {type: string, format: uuid}
        projectId: {type: [string, 'null'], format: uuid}
        environmentId: {type: string, format: uuid}
        environment: {type: string}
        name: {type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,48}[a-z0-9])?$'}
        type: {type: string, enum: [application, database, worker]}
        sourceType: {type: string, enum: [image, git]}
        image: {type: string}
        repoUrl: {type: string}
        branch: {type: string}
        dockerfile: {type: string}
        port: {type: [integer, 'null']}
        command: {type: string}
        dataPath: {type: string, description: Mount path for a persistent named volume}
        memoryMb: {type: integer}
        cpus: {type: number}
        desiredState: {type: string, enum: [running, stopped]}
        status: {type: string, enum: [created, deploying, running, stopped, failed, removing], description: Observed state reported by Docker}
        hostPort: {type: [integer, 'null'], description: Port published on this machine}
        currentDeploymentId: {type: [string, 'null']}
        runningSince: {type: [string, 'null'], format: date-time, description: When the current container started}
        lastDeployAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        teamId: {type: string, format: uuid}
        permissions: {type: array, items: {type: string}}
        effectiveRole: {type: string, enum: [owner, admin, developer, viewer, member]}
    ResourceInput:
      type: object
      required:
      - name
      - sourceType
      properties:
        environmentId: {type: string, format: uuid}
        name: {type: string}
        type: {type: string, enum: [application, database, worker], default: application}
        sourceType: {type: string, enum: [image, git]}
        image: {type: string}
        repoUrl: {type: string, description: Public https URL}
        branch: {type: string, default: main}
        dockerfile: {type: string, default: Dockerfile}
        port: {type: [integer, 'null']}
        command: {type: string}
        dataPath: {type: string}
        memoryMb: {type: integer, default: 512}
        cpus: {type: number, default: 1}
        env: {type: array, items: {$ref: '#/components/schemas/EnvInput'}}
        projectId: {type: [string, 'null'], format: uuid, description: Optional organizational grouping within the active team.}
    EnvInput:
      type: object
      required:
      - key
      properties: {key: {type: string}, value: {type: string}, secret: {type: boolean}, unchanged: {type: boolean, description: Keep the stored value (secrets
            are never sent to the browser)}}
    EnvVar:
      type: object
      properties: {key: {type: string}, value: {type: string, description: Omitted for secrets}, secret: {type: boolean}, updatedBy: {type: string}, updatedAt: {
          type: string, format: date-time}}
    Deployment:
      type: object
      properties:
        id: {type: string, format: uuid}
        resourceId: {type: string, format: uuid}
        number: {type: integer}
        status: {type: string, enum: [queued, building, deploying, successful, failed, cancelled]}
        trigger: {type: string, enum: [manual, create, redeploy, rollback, retry, config]}
        imageRef: {type: string}
        commit: {type: string}
        branch: {type: string}
        reason: {type: string}
        error: {type: string}
        author: {type: string}
        jobId: {type: [string, 'null']}
        current: {type: boolean}
        createdAt: {type: string, format: date-time}
        startedAt: {type: [string, 'null'], format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
    JobLog:
      type: object
      properties: {id: {type: integer}, level: {type: string, enum: [info, warn, error]}, step: {type: string}, message: {type: string}, createdAt: {type: string,
          format: date-time}}
    Team:
      type: object
      required:
      - id
      - name
      - role
      - experiences
      - accessVersion
      properties:
        iconUrl: {type: string, description: Authenticated image URL or an empty string for initials}
        id: {type: string, format: uuid}
        name: {type: string}
        slug: {type: string}
        role: {type: string, enum: &id001 [owner, admin, developer, viewer, member]}
        experiences: &id003 {type: array, items: {type: string, enum: [infrastructure, hosting]}}
        accessVersion: {type: integer}
        permissions: {type: array, items: {type: string}}
        permissionOverrides: &id002 {type: object, properties: {grant: {type: array, items: {type: string}}, deny: {type: array, items: {type: string}}}}
    TeamMember:
      type: object
      properties:
        avatarUrl: {type: string, description: Authenticated image URL or an empty string for initials}
        userId: {type: string, format: uuid}
        email: {type: string, format: email}
        name: {type: string}
        role: {type: string, enum: *id001}
        permissionOverrides: *id002
paths:
  /api/settings/integrations:
    get:
      summary: Read instance-managed provider applications and source policy
      responses:
        '200': {description: Operation completed; redirects apply to OAuth browser endpoints}
        '204': {description: Operation completed; redirects apply to OAuth browser endpoints}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /api/settings/integrations/{provider}:
    parameters:
    - {name: provider, in: path, required: true, schema: {type: string}}
    put:
      summary: Configure an instance provider or source-policy with recent authentication
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200': {description: Operation completed; redirects apply to OAuth browser endpoints}
        '204': {description: Operation completed; redirects apply to OAuth browser endpoints}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /api/account/integrations/providers:
    get:
      summary: List enabled provider capabilities and your linked identities
      responses:
        '200': {description: Operation completed; redirects apply to OAuth browser endpoints}
        '204': {description: Operation completed; redirects apply to OAuth browser endpoints}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /api/account/integrations/providers/{provider}/{action}:
    parameters:
    - {name: provider, in: path, required: true, schema: {type: string}}
    - {name: action, in: path, required: true, schema: {type: string}}
    post:
      summary: Start explicit account OAuth linking or confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200': {description: Operation completed; redirects apply to OAuth browser endpoints}
        '204': {description: Operation completed; redirects apply to OAuth browser endpoints}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /api/account/integrations/providers/{provider}:
    parameters:
    - {name: provider, in: path, required: true, schema: {type: string}}
    delete:
      summary: Disconnect your provider identity without losing the last sign-in method
      responses:
        '200': {description: Operation completed; redirects apply to OAuth browser endpoints}
        '204': {description: Operation completed; redirects apply to OAuth browser endpoints}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /api/teams/{teamId}/integrations/{provider}/connect:
    parameters:
    - {name: teamId, in: path, required: true, schema: {type: string}}
    - {name: provider, in: path, required: true, schema: {type: string}}
    post:
      summary: Authorize a repository connection for this team
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200': {description: Operation completed; redirects apply to OAuth browser endpoints}
        '204': {description: Operation completed; redirects apply to OAuth browser endpoints}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /api/teams/{teamId}/integrations/connections/{id}:
    parameters:
    - {name: teamId, in: path, required: true, schema: {type: string}}
    - {name: id, in: path, required: true, schema: {type: string}}
    delete:
      summary: Disconnect your managed team source when unused
      responses:
        '200': {description: Operation completed; redirects apply to OAuth browser endpoints}
        '204': {description: Operation completed; redirects apply to OAuth browser endpoints}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /api/auth/integrations/{provider}/start:
    parameters:
    - {name: provider, in: path, required: true, schema: {type: string}}
    get:
      summary: Begin provider sign-in with browser-bound state
      security: []
      responses:
        '302': {description: Operation completed; redirects apply to OAuth browser endpoints}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/auth/integrations/{provider}/callback:
    parameters:
    - {name: provider, in: path, required: true, schema: {type: string}}
    get:
      summary: Consume OAuth callback and verify browser account team and provider binding
      security: []
      responses:
        '302': {description: Operation completed; redirects apply to OAuth browser endpoints}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/account/profile:
    get:
      summary: Read your account profile
      responses:
        '200': {description: Account operation completed}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
    patch:
      summary: Update your account name and email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, minLength: 1, maxLength: 80}
                email: {type: string, format: email}
      responses:
        '200': {description: Account operation completed}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
    delete:
      summary: Permanently delete your account after confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email: {type: string, format: email}
      responses:
        '204': {description: Account operation completed}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /api/account/reauth:
    post:
      summary: Confirm your identity for five minutes on this session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                password: {type: string, format: password}
                code: {type: string}
      responses:
        '200': {description: Account operation completed}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /api/account/password:
    put:
      summary: Set or change your password and rotate sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                password: {type: string, format: password}
      responses:
        '200': {description: Account operation completed}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /api/account/sessions:
    get:
      summary: List only your active sessions
      responses:
        '200': {description: Account operation completed}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /api/account/sessions/{id}:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string}}
    delete:
      summary: Revoke one of your sessions or all others
      responses:
        '204': {description: Account operation completed}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /api/account/integrations:
    get:
      summary: Read the configured SSO provider and your connection
      responses:
        '200': {description: Account operation completed}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /api/account/integrations/sso:
    delete:
      summary: Disconnect SSO while preserving a usable sign-in method
      responses:
        '204': {description: Account operation completed}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /api/account/integrations/sso/{action}:
    parameters:
    - {name: action, in: path, required: true, schema: {type: string, enum: [connect, reauth]}}
    post:
      summary: Start explicit SSO linking or identity confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                returnTo: {type: string, pattern: '^/teams/[a-zA-Z0-9-]+/settings/(profile|security)$'}
      responses:
        '200': {description: Account operation completed}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /api/account/passkeys:
    get:
      summary: List your passkey names and usage metadata
      responses:
        '200': {description: Account operation completed}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /api/account/passkeys/{id}:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string}}
    delete:
      summary: Remove your passkey after confirming your identity
      responses:
        '204': {description: Account operation completed}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /api/account/passkeys/register/begin:
    post:
      summary: Begin user-verified resident passkey registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, minLength: 1, maxLength: 80}
      responses:
        '200': {description: Account operation completed}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /api/account/passkeys/register/finish:
    post:
      summary: Verify and save the registered passkey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                flowId: {type: string}
                credential: {type: object, description: Serialized PublicKeyCredential response}
      responses:
        '201': {description: Account operation completed}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /api/account/passkeys/reauth/begin:
    post:
      summary: Begin confirmation with one of your passkeys
      responses:
        '200': {description: Account operation completed}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /api/account/passkeys/reauth/finish:
    post:
      summary: Verify the passkey and confirm this session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                flowId: {type: string}
                credential: {type: object, description: Serialized PublicKeyCredential response}
      responses:
        '200': {description: Account operation completed}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /api/auth/passkeys/begin:
    post:
      summary: Begin a discoverable passkey sign-in
      security: []
      responses:
        '200': {description: Account operation completed}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
