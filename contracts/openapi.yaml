openapi: 3.1.0
info:
  title: IGNITION API
  version: 0.1.0
  description: |
    API for IGNITION, a self-hosted PaaS that runs on your own machine.
    Authentication is a session cookie (`ignition_session`, HttpOnly, SameSite=Lax) set by
    `/api/setup` or `/api/auth/login`. State-changing requests must send an `Origin` header
    matching the dashboard (CSRF protection). Every error uses the `Error` schema.
    Roles, lowest to highest: viewer, developer, admin, owner.
servers:
  - url: http://localhost:8080
security:
  - session: []

components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: ignition_session }
  parameters:
    id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [bad_request, unauthenticated, forbidden, not_found, conflict, validation_failed, rate_limited, unsupported, unavailable, internal, offline] }
            message: { type: string }
            fields: { type: object, additionalProperties: { type: string }, description: Per-field messages for 422 responses }
            requestId: { type: string }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [owner, admin, developer, viewer] }
        status: { type: string, enum: [active, suspended] }
        createdAt: { type: string, format: date-time }
    Environment:
      type: object
      properties: { id: { type: string, format: uuid }, name: { type: string } }
    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        archived: { type: boolean }
        favorite: { type: boolean, description: Favorite for the current user }
        environments: { type: array, items: { $ref: '#/components/schemas/Environment' } }
        resourceCount: { type: integer }
        running: { type: integer }
        failed: { type: integer }
        deploying: { type: integer }
        lastDeployAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    Resource:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        environmentId: { type: string, format: uuid }
        environment: { type: string }
        name: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,48}[a-z0-9])?$' }
        type: { type: string, enum: [application, database, worker] }
        sourceType: { type: string, enum: [image, git] }
        image: { type: string }
        repoUrl: { type: string }
        branch: { type: string }
        dockerfile: { type: string }
        port: { type: [integer, 'null'] }
        command: { type: string }
        dataPath: { type: string, description: Mount path for a persistent named volume }
        memoryMb: { type: integer }
        cpus: { type: number }
        desiredState: { type: string, enum: [running, stopped] }
        status: { type: string, enum: [created, deploying, running, stopped, failed, removing], description: Observed state reported by Docker }
        hostPort: { type: [integer, 'null'], description: Port published on this machine }
        currentDeploymentId: { type: [string, 'null'] }
        runningSince: { type: [string, 'null'], format: date-time, description: When the current container started }
        lastDeployAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ResourceInput:
      type: object
      required: [name, sourceType]
      properties:
        environmentId: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [application, database, worker], default: application }
        sourceType: { type: string, enum: [image, git] }
        image: { type: string }
        repoUrl: { type: string, description: Public https URL }
        branch: { type: string, default: main }
        dockerfile: { type: string, default: Dockerfile }
        port: { type: [integer, 'null'] }
        command: { type: string }
        dataPath: { type: string }
        memoryMb: { type: integer, default: 512 }
        cpus: { type: number, default: 1 }
        env: { type: array, items: { $ref: '#/components/schemas/EnvInput' } }
    EnvInput:
      type: object
      required: [key]
      properties:
        key: { type: string }
        value: { type: string }
        secret: { type: boolean }
        unchanged: { type: boolean, description: Keep the stored value (secrets are never sent to the browser) }
    EnvVar:
      type: object
      properties:
        key: { type: string }
        value: { type: string, description: Omitted for secrets }
        secret: { type: boolean }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
    Deployment:
      type: object
      properties:
        id: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        number: { type: integer }
        status: { type: string, enum: [queued, building, deploying, successful, failed, cancelled] }
        trigger: { type: string, enum: [manual, create, redeploy, rollback, retry, config] }
        imageRef: { type: string }
        commit: { type: string }
        branch: { type: string }
        reason: { type: string }
        error: { type: string }
        author: { type: string }
        jobId: { type: [string, 'null'] }
        current: { type: boolean }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    JobLog:
      type: object
      properties:
        id: { type: integer }
        level: { type: string, enum: [info, warn, error] }
        step: { type: string }
        message: { type: string }
        createdAt: { type: string, format: date-time }

paths:
  /api/health:
    get: { summary: Liveness, security: [], responses: { '200': { description: OK } } }
  /api/ready:
    get: { summary: Readiness (database reachable), security: [], responses: { '200': { description: Ready }, '503': { $ref: '#/components/responses/Error' } } }
  /api/setup:
    get: { summary: Whether first-run setup is required, security: [], responses: { '200': { description: '{ required: boolean }' } } }
    post:
      summary: Create the first owner using the one-time code from the API logs
      security: []
      requestBody: { content: { application/json: { schema: { type: object, required: [code, email, password], properties: { code: { type: string }, email: { type: string }, name: { type: string }, password: { type: string, minLength: 12 } } } } } }
      responses: { '200': { description: Signed in }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/Error' } }
  /api/auth/login:
    post:
      summary: Sign in. Rate limited per IP; accounts lock for 15 minutes after 5 failures.
      security: []
      requestBody: { content: { application/json: { schema: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string } } } } } }
      responses: { '200': { description: Signed in }, '422': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/Error' } }
  /api/auth/logout:
    post: { summary: Sign out, responses: { '204': { description: Signed out } } }
  /api/auth/me:
    get: { summary: Current user, responses: { '200': { description: '{ user: User }' }, '401': { $ref: '#/components/responses/Error' } } }
  /api/system:
    get: { summary: Capabilities of this instance (Docker reachable, supported builders, unsupported features), responses: { '200': { description: Capabilities } } }

  /api/projects:
    get:
      summary: List projects
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Search name and description }
        - { name: archived, in: query, schema: { type: boolean } }
      responses: { '200': { description: '{ projects: Project[] }' } }
    post: { summary: Create a project (admin), responses: { '201': { description: '{ project: Project }' }, '422': { $ref: '#/components/responses/Error' } } }
  /api/projects/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Get a project, responses: { '200': { description: '{ project: Project }' }, '404': { $ref: '#/components/responses/Error' } } }
    patch: { summary: Rename, describe, archive or unarchive (admin), responses: { '200': { description: '{ project: Project }' } } }
    delete: { summary: Delete an empty project (admin). Refused while resources exist., responses: { '204': { description: Deleted }, '409': { $ref: '#/components/responses/Error' } } }
  /api/projects/{id}/favorite:
    parameters: [{ $ref: '#/components/parameters/id' }]
    put: { summary: Favorite for the current user, responses: { '204': { description: OK } } }
    delete: { summary: Unfavorite, responses: { '204': { description: OK } } }
  /api/projects/{id}/resources:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      summary: List resources
      parameters:
        - { name: environment, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string } }
      responses: { '200': { description: '{ resources: Resource[] }' } }
    post:
      summary: Create a resource and queue its first deployment (developer)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ResourceInput' } } } }
      responses: { '201': { description: '{ resource: Resource, deploymentId }' }, '422': { $ref: '#/components/responses/Error' } }

  /api/resources:
    get:
      summary: Inventory of resources across all active projects, with projectName, runningSince and the latest usage sample (if under 60 s old)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string, enum: [application, database, worker] } }
      responses: { '200': { description: '{ resources: Resource[] }' } }
  /api/resources/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Get a resource, responses: { '200': { description: '{ resource: Resource }' } } }
    patch: { summary: Update source or limits (developer). Applies on the next deployment., responses: { '200': { description: '{ resource, requiresRedeploy }' } } }
    delete:
      summary: Queue removal (admin). Requires confirm=<resource name>; volumes=true also deletes the data volume.
      parameters:
        - { name: confirm, in: query, required: true, schema: { type: string } }
        - { name: volumes, in: query, schema: { type: boolean } }
      responses: { '202': { description: '{ jobId }' } }
  /api/resources/{id}/actions:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      summary: Start, stop or restart (developer)
      requestBody: { content: { application/json: { schema: { type: object, properties: { action: { type: string, enum: [start, stop, restart] } } } } } }
      responses: { '202': { description: '{ jobId }' }, '409': { $ref: '#/components/responses/Error' } }
  /api/resources/{id}/env:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: List variables (secret values omitted), responses: { '200': { description: '{ variables: EnvVar[] }' } } }
    put:
      summary: Replace all variables (developer)
      requestBody: { content: { application/json: { schema: { type: object, properties: { variables: { type: array, items: { $ref: '#/components/schemas/EnvInput' } } } } } } }
      responses: { '200': { description: '{ requiresRedeploy: true }' }, '422': { $ref: '#/components/responses/Error' } }
  /api/resources/{id}/env/{key}/reveal:
    parameters: [{ $ref: '#/components/parameters/id' }, { name: key, in: path, required: true, schema: { type: string } }]
    post: { summary: Reveal one secret value (admin, audited), responses: { '200': { description: '{ value }' } } }
  /api/resources/{id}/deployments:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      summary: Deployment history, newest first
      parameters: [{ name: limit, in: query, schema: { type: integer, maximum: 200 } }]
      responses: { '200': { description: '{ deployments: Deployment[] }' } }
    post:
      summary: Deploy latest source, or redeploy/roll back to a previous deployment's artifact (developer)
      requestBody: { content: { application/json: { schema: { type: object, properties: { from: { type: string, format: uuid }, reason: { type: string } } } } } }
      responses: { '202': { description: '{ deploymentId, jobId }' } }
  /api/resources/{id}/logs:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      summary: Runtime stdout/stderr. The running release comes from Docker; pass deployment=<id> for an earlier release's archived copy.
      parameters:
        - { name: deployment, in: query, schema: { type: string, format: uuid } }
        - { name: tail, in: query, schema: { type: integer, maximum: 10000 } }
        - { name: since, in: query, schema: { type: integer }, description: Unix seconds }
      responses: { '200': { description: '{ lines, available, reason?, retention? }' } }
  /api/resources/{id}/stats:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Live CPU, memory and network from Docker. No history is stored., responses: { '200': { description: '{ available, stats?, reason? }' } } }
  /api/resources/{id}/metrics:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      summary: Usage history sampled every 15 s, kept 7 days, averaged into buckets. Empty buckets have samples=0.
      parameters: [{ name: range, in: query, schema: { type: string, enum: ['15m', '1h', '6h', '24h', '7d'], default: '1h' } }]
      responses: { '200': { description: '{ range, stepSeconds, buckets: [{ at, samples, cpuAvg, cpuMax, memoryAvg, memoryMax, memoryLimit, netRxAvg, netTxAvg }], lastSampleAt, limits }' } }
  /api/deployments/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Get a deployment, responses: { '200': { description: '{ deployment: Deployment }' } } }
  /api/deployments/{id}/logs:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      summary: Persisted step logs from the worker
      parameters: [{ name: after, in: query, schema: { type: integer }, description: Return lines with id greater than this }]
      responses: { '200': { description: '{ logs: JobLog[], status }' } }
  /api/deployments/{id}/cancel:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post: { summary: Cancel a queued or running deployment (developer), responses: { '202': { description: '{ status }' }, '409': { $ref: '#/components/responses/Error' } } }
  /api/audit/export:
    get:
      summary: Matching audit events as CSV (admin, audited; up to 50,000). Same filters as /api/audit.
      responses: { '200': { description: text/csv } }
  /api/settings/general:
    get:
      summary: Instance name and ID, deployment defaults for new resources, and facts about this install (version, Docker, host, database).
      responses: { '200': { description: '{ instance, defaults, about }' } }
    put:
      summary: Save the instance name and deployment defaults (admin).
      responses: { '200': { description: '{ instance, defaults }' }, '422': { description: validation error } }
  /api/settings/updates:
    get:
      summary: The installed build (version, commit, build time, image) and update settings (Docker Hub image, channel), with the last check and update run.
      responses: { '200': { description: '{ installed, config, lastCheck }' } }
    put:
      summary: 'Set the Docker Hub image (default notsliver/ignition) and channel: stable, beta or edge.'
      responses: { '200': { description: '{ config }' } }
  /api/settings/updates/check:
    post:
      summary: Read the image's tags on Docker Hub and compare the installed version with the channel's newest (stable = newest release, beta = newest release or pre-release, edge = built from main).
      responses: { '200': { description: '{ lastCheck, installed }' } }
  /api/settings/updates/apply:
    post:
      summary: Start the updater container - pulls the checked image, records it as IGNITION_IMAGE in .env and recreates api and worker. Apps, database and proxy keep running.
      responses: { '202': { description: '{ run }' }, '409': { description: Already running or nothing newer }, '501': { description: Install folder unknown } }
  /api/settings/updates/dismiss:
    post:
      summary: Hide the notice about the last update's result.
      responses: { '204': { description: Dismissed } }
  /api/users:
    get:
      summary: Accounts with role, status, last activity and open sessions, plus pending invites (admin).
      responses: { '200': { description: '{ users, invites }' } }
  /api/users/{id}:
    patch:
      summary: Change role or suspend/reactivate. Guards - not yourself, only owners manage owners, never the last owner.
      responses: { '200': { description: '{ user }' }, '403': { description: not allowed }, '409': { description: last owner } }
    delete:
      summary: Remove an account (same guards).
      responses: { '204': { description: removed } }
  /api/users/{id}/sessions/revoke:
    post:
      summary: Sign the account out everywhere.
      responses: { '200': { description: '{ revoked }' } }
  /api/users/{id}/reset-link:
    post:
      summary: Create a one-time password reset link (24 hours). Shown once; only its hash is stored.
      responses: { '201': { description: '{ url, expiresAt }' } }
  /api/invites:
    post:
      summary: Invite someone by email and role. Returns a one-time join link (7 days) to share; there's no email delivery.
      responses: { '201': { description: '{ invite, url }' } }
  /api/invites/{id}:
    delete:
      summary: Revoke a pending invite.
      responses: { '204': { description: revoked } }
  /api/links/{token}:
    get:
      summary: Public. What a join/reset link is for (kind, email, role). Rate limited.
      responses: { '200': { description: '{ kind, email, role?, expiresAt, instance }' }, '404': { description: expired or used } }
    post:
      summary: Public. Accept an invite (name + password) or finish a reset (password), then sign in.
      responses: { '200': { description: '{ user }' } }
  /api/audit:
    get:
      summary: Audit events, newest first (admin). Never contains secret values.
      parameters: [{ name: target, in: query, schema: { type: string } }]
      responses: { '200': { description: '{ events }' } }
  /api/resources/{id}/source:
    get:
      summary: What the resource is built from - linked credentials, the remote's branches and latest commit (live, via git ls-remote), and the running deployment. A remote that can't be read is reported in `error`.
      responses: { '200': { description: '{ source, branches, latestCommit, deployed, error }' } }
  /api/resources/{id}/terminal:
    get:
      summary: WebSocket. Interactive shell (bash, else sh) in the running container with a TTY. Binary frames are terminal bytes; text frames are JSON control messages (resize from the client; ready/exit from the server). Developer role; root=1 needs admin. Origin must be the dashboard. Audited open/close; 15-minute idle timeout; 4 sessions per resource.
      parameters:
        - { name: cols, in: query, schema: { type: integer } }
        - { name: rows, in: query, schema: { type: integer } }
        - { name: root, in: query, schema: { type: string, enum: ['1'] } }
      responses: { '101': { description: switching protocols }, '409': { description: not running }, '429': { description: too many sessions } }
  /api/resources/{id}/logs/deployments:
    get:
      summary: Deployments whose runtime logs can be read - the running one (live from Docker) and archived ones (kept when their container was replaced; newest 10, up to 10,000 lines each).
      responses: { '200': { description: '{ deployments: [{ deploymentId, number, status, current, archivedAt, lines }] }' } }
  /api/resources/{id}/limits:
    get:
      summary: CPU, memory, reservation, PIDs, swap and restart policy; live usage and restarts from Docker; 7-day average and peak from samples; this machine's capacity.
      responses: { '200': { description: '{ limits, usage, live?, host? }' } }
    put:
      summary: Save limits and apply them to the running container live (no restart). Docker refusals come back as applyError.
      responses: { '200': { description: '{ limits, applied, applyError? }' }, '422': { description: validation error } }
  /api/resources/{id}/storage:
    get:
      summary: Configured volumes with their size on disk and where the running container mounts them, plus detached volumes that still hold data.
      responses: { '200': { description: '{ volumes, detached, running }' } }
    put:
      summary: Replace the volume list (name + absolute mount path). Applies on the next deployment; removed volumes keep their data until deleted.
      responses: { '200': { description: '{ requiresRedeploy }' }, '422': { description: validation error } }
  /api/resources/{id}/storage/{volume}:
    delete:
      summary: Delete a detached volume and its data (admin). Refused while configured or in use.
      responses: { '204': { description: deleted }, '409': { description: still configured or in use } }
  /api/resources/{id}/storage/{volume}/backup:
    get:
      summary: Download the volume's files as .tar.gz (admin, audited). Read through a stopped helper container; the app keeps running.
      responses: { '200': { description: application/gzip } }
  /api/resources/{id}/build:
    get:
      summary: Build & Deploy settings (builder, Dockerfile, context, target, build args, timeout; start command, port, health wait, stop grace, release command) and the latest build.
      responses: { '200': { description: '{ settings, builds, lastBuild }' } }
    put:
      summary: Save Build & Deploy settings. Build settings apply on the next build; deploy settings on the next deployment.
      responses: { '200': { description: '{ settings, requiresRebuild }' }, '422': { description: validation error } }
  /api/resources/{id}/build/inspect:
    post:
      summary: Shallow-clone the repository and report what the next build would use (its Dockerfile, or the stack Ignition detects and the Dockerfile it would generate). Takes unsaved settings.
      responses: { '200': { description: '{ commit, branch, uses, dockerfile?, plan?, error? }' } }
  /api/resources/{id}/networking:
    get:
      summary: Saved networking (ports, extra networks, aliases) next to what Docker reports live, peers on shared networks, drift, and recent diagnostics.
      responses: { '200': { description: '{ config, hostnames, networks, availableNetworks, live, peers, domains, tests, drift, proxy }' } }
    put:
      summary: Replace the networking configuration. Validated against Docker (networks, host port conflicts); applied by the next deployment.
      responses: { '200': { description: '{ config, requiresRedeploy }' }, '422': { description: validation error } }
  /api/resources/{id}/networking/port-check:
    post:
      summary: Whether a host port is free (Ignition's own ports, other resources, any container on this machine).
      responses: { '200': { description: '{ available, message }' } }
  /api/resources/{id}/diagnostics:
    post:
      summary: Run a DNS or TCP test from a temporary probe container on the resource's networks. Targets are limited to the resource itself and resources on shared networks (custom hosts for admins). One at a time per resource, rate limited.
      responses: { '200': { description: '{ test, ranFrom }' }, '409': { description: a test is already running }, '429': { description: rate limited } }
  /api/resources/{id}/domains:
    get:
      summary: Hostnames routed to the resource by the bundled proxy, with the proxy's state and ports.
      responses: { '200': { description: '{ domains, proxy: { running, httpPort, httpsPort } }' } }
    post:
      summary: Add a hostname. Routing starts immediately; the response carries the first real check (DNS, reachability, certificate).
      responses: { '201': { description: '{ domain }' }, '422': { description: validation error } }
  /api/domains/{id}:
    patch:
      summary: Change HTTPS, the target port (or follow the resource's port), or make it the primary domain.
      responses: { '200': { description: '{ domain }' } }
    delete:
      summary: Stop routing the hostname. DNS records are left untouched.
      responses: { '204': { description: removed } }
  /api/domains/{id}/check:
    post:
      summary: Re-run the checks now and record what was found.
      responses: { '200': { description: '{ domain }' } }
  /api/sources:
    get:
      summary: Instance-wide git providers and container registries. Secrets are never returned (only hasSecret and a masked hint).
      parameters: [{ name: kind, in: query, schema: { type: string, enum: [git, registry] } }, { name: q, in: query, schema: { type: string } }]
      responses: { '200': { description: '{ sources }' } }
    post:
      summary: Add a source (admin). The secret is encrypted at rest and the connection is tested immediately.
      responses: { '201': { description: '{ source }' }, '422': { description: validation error } }
  /api/sources/{id}:
    get:
      summary: One source with the resources that use it.
      responses: { '200': { description: '{ source, resources }' }, '404': { description: not found } }
    patch:
      summary: Edit a source (admin). Sending a new secret rotates it; omitting it keeps the current one. Re-tests the connection.
      responses: { '200': { description: '{ source }' } }
    delete:
      summary: Delete a source (admin). Refused with 409 while resources use it.
      responses: { '204': { description: deleted }, '409': { description: in use } }
  /api/sources/{id}/test:
    post:
      summary: Test the connection against the provider or registry and record the real result.
      responses: { '200': { description: '{ source }' } }
  /api/sources/{id}/repositories:
    get:
      summary: Up to 100 repositories visible to a GitHub, GitLab or Bitbucket token.
      responses: { '200': { description: '{ repositories }' }, '501': { description: not supported for this source } }
  /api/resources/{id}/health:
    get:
      summary: Health check settings, the worker's current verdict (unknown, starting, healthy, unhealthy) and the last 60 results.
      responses: { '200': { description: '{ config, state, results, resourcePort, status }' } }
    put:
      summary: Save the health check. While enabled, deployments must pass it before taking over, and failing apps are restarted (at most 3 times in 15 minutes).
      responses: { '200': { description: '{ config, state }' }, '422': { description: validation error } }
  /api/resources/{id}/health/test:
    post:
      summary: Run one check now with the given (possibly unsaved) settings, through the worker. Waits for the answer.
      responses: { '200': { description: '{ result: { ok, latencyMs, detail, inconclusive? } }' }, '503': { description: worker didn't answer } }
  /api/resources/{id}/releases:
    get:
      summary: Successful deployments with whether their exact image is still on this machine, plus the rollback log.
      responses: { '200': { description: '{ releases, rollbacks, sourceType }' } }
  /api/deployments/{id}/env-diff:
    get:
      summary: Names (never values) of variables a rollback to this release would add, remove or change.
      responses: { '200': { description: '{ snapshot, added, removed, changed }' } }
  /api/resources/{id}/tasks:
    get:
      summary: Scheduled tasks with their next run, schedule in words and last run.
      responses: { '200': { description: '{ tasks, status }' } }
    post:
      summary: Create a scheduled task (cron schedule, IANA timezone, command run inside the container, timeout).
      responses: { '201': { description: '{ task }' }, '422': { description: validation error } }
  /api/tasks/{id}:
    patch:
      summary: Change a task (any of name, schedule, timezone, command, timeoutSeconds, enabled).
      responses: { '200': { description: '{ task }' }, '422': { description: validation error } }
    delete:
      summary: Delete a task and its run history; a run in progress is asked to stop.
      responses: { '204': { description: Deleted } }
  /api/tasks/{id}/run:
    post:
      summary: Run the task now. Refused while it's already running or the resource isn't running.
      responses: { '202': { description: '{ run }' }, '409': { description: already running or nowhere to run } }
  /api/tasks/{id}/runs:
    get:
      summary: The last 20 runs (without output).
      responses: { '200': { description: '{ runs }' } }
  /api/task-runs/{id}:
    get:
      summary: One run with its output (the last 64 KB); updated every 2 seconds while it runs.
      responses: { '200': { description: '{ run }' } }
  /api/task-runs/{id}/cancel:
    post:
      summary: Stop a queued or running run (SIGTERM, then SIGKILL after 10 seconds).
      responses: { '202': { description: '{ status }' }, '409': { description: already finished } }
  /api/cron/preview:
    get:
      summary: Validate a schedule (?schedule=&timezone=) and show it in words with its next three runs.
      responses: { '200': { description: '{ valid, error?, description?, next? }' } }
  /api/resources/{id}/access:
    get:
      summary: Who can do what (from roles), the deploy hook (without its secret) and the resource's tokens.
      responses: { '200': { description: '{ people, hook, tokens, branch, sourceType, apiBase }' } }
  /api/resources/{id}/hook:
    post:
      summary: Create or regenerate the deploy hook URL (the old one stops working).
      responses: { '201': { description: '{ url }' } }
    delete:
      summary: Remove the deploy hook.
      responses: { '204': { description: Removed } }
  /api/resources/{id}/hook/reveal:
    post:
      summary: Show the deploy hook URL again (audited).
      responses: { '200': { description: '{ url }' }, '404': { description: no hook } }
  /api/resources/{id}/tokens:
    post:
      summary: Create a Bearer token for this resource only, read (status, deployments, logs) or deploy, optionally expiring. Shown once.
      responses: { '201': { description: '{ token, item }' }, '422': { description: validation error } }
  /api/resource-tokens/{id}:
    delete:
      summary: Revoke a resource token.
      responses: { '204': { description: Revoked } }
  /api/hooks/{token}:
    post:
      summary: Deploy hook (no session; the URL is the secret). Understands GitHub and GitLab push events, ignores other branches and tags, and joins a deployment that's still queued.
      responses: { '202': { description: '{ deployed, deploymentId?, number?, skipped? }' }, '200': { description: GitHub ping }, '404': { description: unknown hook } }
  /api/resources/{id}/advanced:
    get:
      summary: Name, container options, identifiers, drift between saved settings and the running container, variables changed since the release started, built images and move targets.
      responses: { '200': { description: '{ name, advanced, identifiers, drift?, envChanged?, images?, moveTargets }' } }
    put:
      summary: Save name and container options (entrypoint, working directory, user, labels, read-only root, init, privileged - admins only). Applies on the next deploy.
      responses: { '200': { description: '{ advanced, resource, requiresRedeploy }' }, '422': { description: validation error } }
  /api/resources/{id}/export:
    get:
      summary: Download the configuration as JSON. Variable names only; values never leave the server.
      responses: { '200': { description: JSON file } }
  /api/resources/{id}/images/purge:
    post:
      summary: Remove this resource's built images except the running one (and the newest `keep`). Rollbacks to removed releases need a rebuild.
      responses: { '200': { description: '{ removed, freedBytes, failed }' } }
  /api/resources/{id}/move:
    post:
      summary: Move to another environment (any project) and redeploy the same release there. Domains, variables, volumes and history go with it.
      responses: { '200': { description: '{ resource, projectId, projectName, environmentName, deploymentId? }' }, '422': { description: name taken there } }

  # ----------------------------- Infrastructure › Servers -----------------------------
  # Status model: connectionState (pending, connecting, online, degraded, offline, unknown — unknown means the
  # last check is older than staleAfterSeconds), runtimeState (ready, not_installed, unavailable, incompatible,
  # unknown) and operator flags (deploymentsEnabled, maintenance, removing) are independent. Remote servers are
  # Docker Engines reached over mutual TLS; only the local server receives deployments.
  /api/servers:
    get:
      summary: Server inventory, filtered, sorted and paged in the database, with overview counts.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Name, hostname, endpoint, environment, location, description or labels }
        - { name: filter, in: query, schema: { type: string, enum: [all, online, offline, degraded, pending, unknown, maintenance, deployable, blocked, attention] } }
        - { name: sort, in: query, schema: { type: string, enum: [name, status, lastSeen, workloads, cpu, memory, disk] } }
        - { name: dir, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer } }
      responses: { '200': { description: '{ servers: ServerView[], total, summary: { total, available, attention }, staleAfterSeconds, checkIntervalSeconds }' } }
    post:
      summary: Register a remote Docker Engine (admin). Re-verifies the connection and requires the engine to present expectedFingerprint. The client key is sealed and never returned.
      responses: { '201': { description: '{ server }' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /api/servers/verify:
    post:
      summary: Run the enrollment checks (network, TLS identity, authentication, engine, platform, permissions) without saving anything (admin, rate limited). Loopback, link-local and metadata addresses are refused.
      responses: { '200': { description: '{ ok, endpoint, steps: [{ id, title, status, detail, ms }], fingerprint, engine, capabilities, clientCertificate }' } }
  /api/servers/bulk:
    post:
      summary: 'Bulk action on servers (admin): test, refresh, diagnostics, enable_deployments, disable_deployments, enter_maintenance. Each target is validated on its own; preview=true only reports eligibility.'
      responses: { '200': { description: '{ action, label, targets: [{ id, name, eligible, reason, status, jobId?, error? }] }' } }
  /api/servers/bundle:
    get:
      summary: Diagnostic bundles for several servers as one JSON download (admin, audited). Never contains credentials, keys, environment values or log contents.
      parameters: [{ name: ids, in: query, required: true, schema: { type: string }, description: Comma-separated server IDs }]
      responses: { '200': { description: JSON file } }
  /api/servers/capacity:
    get:
      summary: Fleet capacity planning. Per server, committed workload CPU and memory limits against cores and memory, p95 CPU and memory over the window, disk use with a days-until-full projection, a status (constrained, watch, ok, underused, unknown) and findings; plus fleet totals.
      parameters: [{ name: window, in: query, schema: { type: string, enum: ['24h', '7d'] } }]
      responses: { '200': { description: '{ window, servers: CapacityServer[], totals, thresholds }' } }
  /api/servers/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: One server with settings, engine info, verified capabilities, warnings and deployment eligibility, responses: { '200': { description: '{ server: ServerView }' } } }
    patch:
      summary: Update name, hostname, description, environment, location, labels, notes or settings (admin, including settings.hostProbe).
      responses: { '200': { description: '{ server }' }, '422': { $ref: '#/components/responses/Error' } }
    delete:
      summary: Remove the registration (admin, ?confirm=<name>). Refused while resources or work remain. Nothing on the host is stopped or deleted.
      responses: { '204': { description: Removed }, '409': { $ref: '#/components/responses/Error' } }
  /api/servers/{id}/removal:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: What removing the server would and wouldn't do and what blocks it (admin), responses: { '200': { description: '{ server, resources, activity, volumes, tasks, blockers, effects, notDone, reachable }' } } }
  /api/servers/{id}/test:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post: { summary: Check the connection now and record the result (developer), responses: { '200': { description: '{ result: { reached, runtime, error, errorKind, latencyMs, docker? }, server }' } } }
  /api/servers/{id}/refresh:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post: { summary: Queue a runtime refresh that also reconciles workload status (developer), responses: { '202': { description: '{ jobId }' } } }
  /api/servers/{id}/deployments:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      summary: Deployments of resources on this server, newest first.
      parameters: [{ name: q, in: query, schema: { type: string } }, { name: status, in: query, schema: { type: string, enum: [active, successful, failed, cancelled] } }, { name: limit, in: query, schema: { type: integer } }, { name: offset, in: query, schema: { type: integer } }]
      responses: { '200': { description: '{ deployments: (Deployment & { resourceName, resourceType, projectId, projectName, environment })[], total }' } }
    put:
      summary: Enable or disable new deployments (admin). Remote servers can't be enabled.
      responses: { '200': { description: '{ server }' }, '409': { $ref: '#/components/responses/Error' } }
  /api/servers/{id}/maintenance:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Maintenance policy, in-flight work, workloads, volumes, tasks and history, responses: { '200': { description: '{ server, activity, workloads, running, volumes, tasks, history, policy }' } } }
    post: { summary: 'Enter or exit maintenance (admin): { enabled, note }', responses: { '200': { description: '{ server, changed }' } } }
  /api/servers/{id}/maintenance/note:
    parameters: [{ $ref: '#/components/parameters/id' }]
    put: { summary: Update the note of the active maintenance window (admin), responses: { '204': { description: Saved } } }
  /api/servers/{id}/events:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Server events (kind filter, q, before cursor), responses: { '200': { description: '{ events }' } } }
  /api/servers/{id}/jobs:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Recent server jobs, responses: { '200': { description: '{ jobs }' } } }
  /api/servers/{id}/metrics:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      summary: Host samples every 15 s, kept 7 days. NULL means not measured; support says which metrics this server's collector can measure.
      parameters: [{ name: range, in: query, schema: { type: string, enum: ['15m', '1h', '6h', '24h', '7d'] } }]
      responses: { '200': { description: '{ range, stepSeconds, buckets, latest, support, reasons, collector, collectorState, retentionDays, intervalSeconds, capacity }' } }
  /api/servers/{id}/resources:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Workloads assigned to the server with desired and observed state, responses: { '200': { description: '{ resources, health, observedAt, server }' } } }
  /api/servers/{id}/logs:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      summary: Unified, redacted logs. Sources events, jobs, container (unmanaged containers need admin); daemon and agent report why they're unavailable.
      parameters: [{ name: source, in: query, schema: { type: string } }, { name: container, in: query, schema: { type: string } }, { name: q, in: query, schema: { type: string } }, { name: level, in: query, schema: { type: string } }, { name: range, in: query, schema: { type: string }, description: 'Go duration, e.g. 1h' }, { name: stream, in: query, schema: { type: string, enum: [stdout, stderr] } }, { name: resource, in: query, schema: { type: string } }, { name: limit, in: query, schema: { type: integer } }]
      responses: { '200': { description: '{ lines: [{ time, level, source, stream?, message, fields?, cursor }], available, reason?, sources, since, timezone, limit, truncated }' } }
  /api/servers/{id}/diagnostics:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Check catalogue, latest result per check, recent runs and the active run, responses: { '200': { description: '{ checks, latest, runs, active, server }' } } }
    post: { summary: 'Run checks (developer): { checks? } — all when omitted. Targets are fixed per check; none accept user-supplied destinations.', responses: { '202': { description: '{ runId, jobId }' }, '409': { $ref: '#/components/responses/Error' } } }
  /api/servers/{id}/diagnostics/bundle:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Safe diagnostic bundle as a JSON download (admin, audited), responses: { '200': { description: JSON file } } }
  /api/diagnostic-runs/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: A diagnostic run with its results, responses: { '200': { description: '{ run }' } } }
  /api/servers/{id}/docker:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Engine facts, compatibility, object counts and Docker disk usage, responses: { '200': { description: '{ engine, compatible, minApiVersion, counts, disk, dataRoot? }' }, '503': { $ref: '#/components/responses/Error' } } }
  /api/servers/{id}/docker/containers:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Every container with its owner (resource, helper, ignition, unmanaged), responses: { '200': { description: '{ containers, observedAt }' } } }
  /api/servers/{id}/docker/containers/{cid}/actions:
    parameters: [{ $ref: '#/components/parameters/id' }, { name: cid, in: path, required: true, schema: { type: string } }]
    post: { summary: Start, stop or restart the current container of an IGNITION resource on this server (developer). Unmanaged containers are refused., responses: { '202': { description: '{ jobId, resourceId }' }, '403': { $ref: '#/components/responses/Error' } } }
  /api/servers/{id}/docker/images:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Images with tags, digests, sizes, users, and whether a deployment retains them, responses: { '200': { description: '{ images, layersSize, buildCache }' } } }
  /api/servers/{id}/docker/networks:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Networks with attached containers, responses: { '200': { description: '{ networks }' } } }
  /api/servers/{id}/docker/volumes:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Volumes with ownership, users and measured size (-1 when unknown), responses: { '200': { description: '{ volumes }' } } }
  /api/servers/{id}/docker/inspect:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      summary: Raw inspect document (admin, audited). Container environment values are masked.
      parameters: [{ name: kind, in: query, schema: { type: string, enum: [container, image, network, volume] } }, { name: id, in: query, schema: { type: string } }]
      responses: { '200': { description: '{ kind, document, redacted }' } }
  /api/servers/{id}/cleanup/preview:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post: { summary: 'Plan a Docker cleanup (admin): { containers, dangling, unusedImages, networks, buildCache }. Volumes are never included.', responses: { '200': { description: '{ items, protected, bytes, volumes }' } } }
  /api/servers/{id}/cleanup:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post: { summary: Remove the confirmed items that are still eligible as a job (admin, audited). Removals never force., responses: { '202': { description: '{ jobId }' } } }
  /api/servers/{id}/storage:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Volumes, mounts, bind mounts and configured-but-missing volumes, responses: { '200': { description: '{ volumes, mounts, binds, missing, backups, hostPaths }' } } }
  /api/servers/{id}/networking:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Published ports with exposure, Docker networks, domains, proxy, and what isn't observable, responses: { '200': { description: '{ ports, networks, domains, proxy, hostInterfaces, firewall }' } } }
  /api/servers/{id}/tasks:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Scheduled server tasks and the available task kinds, responses: { '200': { description: '{ tasks, kinds }' } } }
    post: { summary: Create a scheduled task of a built-in kind (admin). No arbitrary commands., responses: { '201': { description: '{ task }' }, '422': { $ref: '#/components/responses/Error' } } }
  /api/server-tasks/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    patch: { summary: Update a server task (admin), responses: { '200': { description: '{ task }' } } }
    delete: { summary: Delete a server task (admin), responses: { '204': { description: Deleted } } }
  /api/server-tasks/{id}/run:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post: { summary: Run a server task now (admin), responses: { '202': { description: '{ runId }' }, '409': { $ref: '#/components/responses/Error' } } }
  /api/server-tasks/{id}/runs:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Recent runs of a server task, responses: { '200': { description: '{ runs }' } } }
  /api/server-jobs/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: A server job with its result and logs, responses: { '200': { description: '{ job, logs }' } } }
  /api/server-jobs/{id}/cancel:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post: { summary: Cancel a queued or running server job (admin), responses: { '202': { description: '{ status }' }, '409': { $ref: '#/components/responses/Error' } } }
  /api/servers/{id}/access:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Connection method, identity, trust, credential metadata (never the key), role permissions and security events, responses: { '200': { description: '{ server, access }' } } }
  /api/servers/{id}/credentials:
    parameters: [{ $ref: '#/components/parameters/id' }]
    put: { summary: 'Rotate the client certificate and key (admin). The new pair is verified against the engine before the old one is replaced; a changed host certificate returns 409 identity_changed with the presented fingerprint unless acceptFingerprint is set.', responses: { '200': { description: '{ server }' }, '409': { $ref: '#/components/responses/Error' } } }
    delete: { summary: Revoke stored credentials (admin, ?confirm=<name>). The registration stays., responses: { '200': { description: '{ server }' } } }
  /api/servers/{id}/endpoint:
    parameters: [{ $ref: '#/components/parameters/id' }]
    put: { summary: Move a remote server to a new address that presents the same host identity (admin), responses: { '200': { description: '{ server }' }, '409': { $ref: '#/components/responses/Error' } } }
  /api/automations/catalog:
    get:
      summary: Built-in steps (with what each verifies and its risk), events, metrics, the capability catalog (available or what it needs) and templates.
      responses: { '200': { description: '{ actions, events, metrics, catalog, templates }' } }
  /api/automations:
    get:
      summary: Automations of a resource (?resourceId=) or that act on a server (?serverId=), with counts and runs that need someone.
      responses: { '200': { description: '{ automations, counts, attention, managedServers?, resourceAutomations? }' } }
    post:
      summary: Create an automation. Resource automations need a developer, server automations an admin.
      responses: { '201': { description: '{ automation }' }, '422': { description: validation error } }
  /api/automations/preview:
    post:
      summary: Validate a draft and show its workflow, the servers it would act on now, its next runs and whether it's disruptive.
      responses: { '200': { description: '{ workflow, errors, targets, nextRuns, disruptive, inWindowNow }' } }
  /api/automations/{id}:
    get:
      summary: One automation with its last 25 runs.
      responses: { '200': { description: '{ automation, runs }' } }
    put:
      summary: Change an automation. Enabling a paused one clears its failure count.
      responses: { '200': { description: '{ automation }' }, '422': { description: validation error } }
    delete:
      summary: Delete an automation and its history.
      responses: { '204': { description: Deleted } }
  /api/automations/{id}/run:
    post:
      summary: Run now (observe records recommendations, assisted waits for approval, automatic executes). Over the hourly limit the run is recorded as skipped.
      responses: { '202': { description: '{ run }' }, '200': { description: '{ run } skipped' } }
  /api/automations/{id}/hook:
    post:
      summary: Create or replace the secret webhook URL that triggers this automation. Shown once.
      responses: { '201': { description: '{ url }' } }
  /api/automations/{id}/test-notify:
    post:
      summary: Send a test message to the automation's notification webhook.
      responses: { '200': { description: '{ status }' }, '503': { description: webhook failed } }
  /api/automation-runs/{id}:
    get:
      summary: A run with its plan, each step's output and how its outcome was verified.
      responses: { '200': { description: '{ run }' } }
  /api/automation-runs/{id}/approve:
    post:
      summary: Approve a plan that's awaiting approval; it runs inside the automation's maintenance window.
      responses: { '200': { description: '{ run }' }, '409': { description: not awaiting approval } }
  /api/automation-runs/{id}/reject:
    post:
      summary: Reject a plan; nothing runs.
      responses: { '200': { description: '{ run }' }, '409': { description: not awaiting approval } }
  /api/automation-runs/{id}/acknowledge:
    post:
      summary: Clear a failed run or recommendation from Needs attention.
      responses: { '200': { description: '{ run }' } }
  /api/automation-runs/{id}/cancel:
    post:
      summary: Cancel a run that hasn't started.
      responses: { '200': { description: '{ run }' }, '409': { description: already running or finished } }
  /api/automation-hooks/{token}:
    post:
      summary: Trigger an automation (no session; the URL is the secret). Optional JSON { reason }.
      responses: { '202': { description: '{ runId, status }' }, '404': { description: unknown hook } }
  /api/dashboard:
    get:
      summary: Counts, what needs attention (each linking to where it's fixed) and the latest deployments across all resources.
      responses: { '200': { description: '{ stats, alerts, deployments, localServer? }' } }
  /api/projects/import/git/inspect:
    post:
      summary: Clone a branch (shallow) and report what an import would create - a compose file's services, a Dockerfile or the detected stack.
      responses: { '200': { description: '{ commit, suggestedName, composeFile?, plan?, dockerfile, stack?, port? }' }, '422': { description: repository unreachable } }
  /api/projects/import/compose/preview:
    post:
      summary: Parse a pasted compose file (and optional .env) into the resources it would create, with warnings for what doesn't translate.
      responses: { '200': { description: '{ plan }' }, '422': { description: invalid compose file } }
  /api/projects/import:
    post:
      summary: Create a project from a Git repository (compose services or one application) or a compose file, in one transaction.
      responses: { '201': { description: '{ project, resources }' }, '422': { description: validation error } }
  /api/projects/{id}/duplicate:
    post:
      summary: Copy a project's environments and resources with their settings (optionally secret values, optionally deploy). Volume data, domains, history, tokens and automations stay.
      responses: { '201': { description: '{ project, resources, deployed, notes }' } }
  /api/databases/engines:
    get:
      summary: Database engines with accepted dump formats, how live migration and replace work; function runtimes.
      responses: { '200': { description: '{ engines, runtimes }' } }
  /api/databases/check-source:
    post:
      summary: Validate a live database URL for an engine and check the server answers from this machine.
      responses: { '200': { description: '{ ok, address, latencyMs?, error? }' } }
  /api/resources/{id}/imports:
    post:
      summary: Import data into a database - multipart upload (file, replace) or JSON { source url|s3|live, ... }. Runs as a job.
      responses: { '202': { description: '{ import }' }, '409': { description: not a running database } }
    get:
      summary: The database's last 20 imports.
      responses: { '200': { description: '{ imports }' } }
  /api/data-imports/{id}:
    get:
      summary: One import with its log (?after= for new lines).
      responses: { '200': { description: '{ import, logs }' } }
  /api/data-imports/{id}/cancel:
    post:
      summary: Cancel a queued or running import.
      responses: { '202': { description: '{ status }' } }
  /api/projects/{id}/external-databases:
    post:
      summary: Register a database running elsewhere. IGNITION checks it's reachable and shares its connection URL with apps; it doesn't run it.
      responses: { '201': { description: '{ resource }' }, '422': { description: validation error } }
  /api/resources/{id}/connection:
    get:
      summary: How apps connect to a database (private name or external address); the full URL only for admins.
      responses: { '200': { description: '{ engine, host, port, user, database, maskedUrl, url? }' } }
  /api/resources/{id}/connection/share:
    post:
      summary: Store the database's connection URL as a secret variable on another resource of the project.
      responses: { '200': { description: '{ target, key, requiresRedeploy }' } }
  /api/resources/{id}/connection/test:
    post:
      summary: Check an external database accepts connections from this machine.
      responses: { '200': { description: '{ ok, address, latencyMs, error? }' } }
  /api/resources/{id}/function:
    get:
      summary: A function's runtime and handler code.
      responses: { '200': { description: '{ runtime, code, template, file }' } }
    put:
      summary: Save the handler (and the built-in server) and optionally redeploy.
      responses: { '200': { description: '{ deploymentId }' }, '422': { description: too large } }
  /api/resources/{id}/function/invoke:
    post:
      summary: Send one request to the function from inside its network and return status, headers and body.
      responses: { '200': { description: '{ result }' } }
