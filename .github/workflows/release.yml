# Publishes notsliver/ignition to Docker Hub.
#
#   git tag v0.1.0-beta && git push --tags   →  notsliver/ignition:0.1.0-beta (+ :beta for pre-releases)
#   git tag v1.2.3 && git push --tags        →  :1.2.3, :1.2, :1, :latest
#   push to main                             →  :edge (and :sha-<short>)
#
# Needs repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token
# with read/write scope for notsliver/ignition).
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: notsliver/ignition

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          else
            v="edge"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          [[ "$v" == *-* ]] && echo "prerelease=true" >> "$GITHUB_OUTPUT" || echo "prerelease=false" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.version.outputs.prerelease == 'false' }}
            type=semver,pattern={{major}},enable=${{ steps.version.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && steps.version.outputs.prerelease == 'false' }}
            type=raw,value=beta,enable=${{ startsWith(github.ref, 'refs/tags/v') && steps.version.outputs.prerelease == 'true' }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=IGNITION
            org.opencontainers.image.description=Self-hosted platform for deploying apps and databases with Docker
            org.opencontainers.image.licenses=Apache-2.0

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IGNITION_VERSION=${{ steps.version.outputs.version }}
            IGNITION_COMMIT=${{ github.sha }}
            IGNITION_BUILT_AT=${{ steps.version.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Docker Hub description
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: Self-hosted platform for deploying apps and databases with Docker
          readme-filepath: ./README.md

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            Docker image: `notsliver/ignition:${{ needs.image.outputs.version }}` (linux/amd64, linux/arm64)

            Update an existing install: set `IGNITION_IMAGE=notsliver/ignition:${{ needs.image.outputs.version }}` in `.env`, then
            `docker compose --env-file .env -f deploy/docker-compose.yml pull api worker && docker compose --env-file .env -f deploy/docker-compose.yml up -d`
