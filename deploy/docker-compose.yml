# IGNITION on a single machine. Start with:  docker compose --env-file .env -f deploy/docker-compose.yml up -d --build
#
# SECURITY: the api and worker mount the Docker socket. Anything that can talk to that socket
# effectively has root on this machine, so only give IGNITION accounts to people you'd trust with that.

name: ignition

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ignition
      POSTGRES_USER: ignition
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ignition -d ignition"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        IGNITION_VERSION: ${IGNITION_VERSION:-dev}
        IGNITION_COMMIT: ${IGNITION_COMMIT:-unknown}
        IGNITION_BUILT_AT: ${IGNITION_BUILT_AT:-}
        IGNITION_DIRTY: ${IGNITION_DIRTY:-false}
    image: ${IGNITION_IMAGE:-notsliver/ignition:latest}
    restart: unless-stopped
    command: ["ignition-api"]
    depends_on: { db: { condition: service_healthy } }
    environment: &env
      IGNITION_DATABASE_URL: postgres://ignition:${POSTGRES_PASSWORD}@db:5432/ignition?sslmode=disable
      IGNITION_SECRET_KEY: ${IGNITION_SECRET_KEY:?Set IGNITION_SECRET_KEY in .env (openssl rand -base64 32)}
      IGNITION_PUBLIC_URL: ${IGNITION_PUBLIC_URL:-http://localhost:8080}
      IGNITION_SECURE_COOKIES: ${IGNITION_SECURE_COOKIES:-false}
      IGNITION_PUBLISH_HOST: ${IGNITION_PUBLISH_HOST:-localhost}
      IGNITION_HTTP_PORT: ${IGNITION_HTTP_PORT:-80}
      IGNITION_HTTPS_PORT: ${IGNITION_HTTPS_PORT:-443}
      IGNITION_SOURCE_DIR: ${IGNITION_SOURCE_DIR:-}
      IGNITION_IMAGE: ${IGNITION_IMAGE:-notsliver/ignition:latest}
      IGNITION_LOCAL_DEVELOPMENT: ${IGNITION_LOCAL_DEVELOPMENT:-false}
    ports:
      - "${IGNITION_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - proxy-admin:/run/ignition-proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/ready"]
      interval: 10s
      timeout: 3s
      retries: 6

  worker:
    image: ${IGNITION_IMAGE:-notsliver/ignition:latest}
    restart: unless-stopped
    command: ["ignition-worker"]
    depends_on: { api: { condition: service_healthy } }
    environment:
      <<: *env
      IGNITION_WORKER_CONCURRENCY: ${IGNITION_WORKER_CONCURRENCY:-2}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - proxy-admin:/run/ignition-proxy
    stop_grace_period: 40s

  # Routes custom domains to resources and handles HTTPS. Ignition generates its whole config.
  # The admin API is a unix socket shared only with api and worker: apps on the "ignition" network can't reach it.
  proxy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    entrypoint: ["sh", "-c", "rm -f /run/ignition-proxy/admin.sock; exec caddy run --config /etc/caddy/bootstrap.json"]
    ports:
      - "${IGNITION_HTTP_PORT:-80}:80"
      - "${IGNITION_HTTPS_PORT:-443}:443"
    volumes:
      - ./proxy-bootstrap.json:/etc/caddy/bootstrap.json:ro
      - proxy-admin:/run/ignition-proxy
      - proxy-data:/data
    networks: [default, apps]

networks:
  # Deployed apps run here (created by the installer and the worker); the proxy joins it to reach them.
  apps:
    name: ignition
    external: true

volumes:
  db-data:
  proxy-admin:
  proxy-data:
